name: Deploy documentation to GitHub Pages

on:
  # Build and deploy on every push to the default branch. The site rebuilds
  # when the tutorial changes OR when the library API changes, because the
  # code snippets are type-checked against the freshly built library.
  push:
    branches: [development]
    paths:
      - 'website/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  # Allow running the workflow manually from the Actions tab.
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, without cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus site
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Build the library first so the website's `ontouml-js` dependency
      # (a file:.. link) has its dist/ + type declarations available to
      # Twoslash, which type-checks the tutorial's code snippets.
      - name: Build ontouml-js
        run: |
          npm ci
          npm run build

      - name: Build website
        working-directory: website
        run: |
          npm install
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
